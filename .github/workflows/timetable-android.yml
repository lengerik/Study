name: Build Timetable Android APK

on:
  push:
    branches: [ "master" ]
    paths:
      - "timetable-android/**"
      - ".github/workflows/timetable-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: timetable-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: timetable-release-unsigned
          path: timetable-android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
