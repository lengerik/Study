plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.koohat.timetable'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.koohat.timetable'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
